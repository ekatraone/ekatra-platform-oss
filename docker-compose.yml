version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ekatra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ekatra
      POSTGRES_USER: ekatra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ekatra_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/database/src/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ekatra"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for queues and caching
  redis:
    image: redis:7-alpine
    container_name: ekatra-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API Server
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: ekatra-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://ekatra:${POSTGRES_PASSWORD:-ekatra_dev_password}@postgres:5432/ekatra
      DATABASE_DISABLE_SSL: "true"   # Local Docker only — no SSL between containers on same host
      REDIS_URL: redis://redis:6379
      
      # WhatsApp Cloud API
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET}
      
      # OpenAI
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      
      # Features
      ENABLE_VOICE_RESPONSE: ${ENABLE_VOICE_RESPONSE:-false}
      DEFAULT_PUSH_TIME: ${DEFAULT_PUSH_TIME:-09:00}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Asia/Kolkata}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend (Nginx serving React build)
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: ekatra-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${API_URL:-http://localhost:3000}
    ports:
      - "8080:80"
    depends_on:
      - backend

  # Worker for background jobs (optional)
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: ekatra-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://ekatra:${POSTGRES_PASSWORD:-ekatra_dev_password}@postgres:5432/ekatra
      DATABASE_DISABLE_SSL: "true"   # Local Docker only
      REDIS_URL: redis://redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Worker is now a first-class service — remove --profile restriction.
    # If you want to run backend-only for frontend dev: use docker-compose up backend frontend postgres redis

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: ekatra-network
