version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ekatra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ekatra
      POSTGRES_USER: ekatra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ekatra_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ekatra"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for queues and caching
  redis:
    image: redis:7-alpine
    container_name: ekatra-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Apply schema changes once before either application starts.
  migrate:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    command: ["node", "node_modules/@ekatra/database/dist/migrate.js"]
    restart: "no"
    environment:
      DATABASE_URL: postgresql://ekatra:${POSTGRES_PASSWORD:-ekatra_dev_password}@postgres:5432/ekatra
      DATABASE_DISABLE_SSL: "true"
    depends_on:
      postgres:
        condition: service_healthy

  # Backend API Server
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: ekatra-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://ekatra:${POSTGRES_PASSWORD:-ekatra_dev_password}@postgres:5432/ekatra
      DATABASE_DISABLE_SSL: "true"   # Local Docker only — no SSL between containers on same host
      REDIS_URL: redis://redis:6379
      
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-cloudapi}
      META_PHONE_NUMBER_ID: ${META_PHONE_NUMBER_ID}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN}
      META_APP_SECRET: ${META_APP_SECRET}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_NUMBER: ${TWILIO_WHATSAPP_NUMBER:-}
      WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL:-}
      
      # OpenAI
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      
      # Features
      ENABLE_VOICE_RESPONSE: ${ENABLE_VOICE_RESPONSE:-false}
      DEFAULT_PUSH_TIME: ${DEFAULT_PUSH_TIME:-09:00}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Asia/Kolkata}
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:3000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend (Nginx serving React build)
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_URL: ${API_URL:-http://localhost:3000}
    container_name: ekatra-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

  # Required production delivery worker
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: ekatra-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://ekatra:${POSTGRES_PASSWORD:-ekatra_dev_password}@postgres:5432/ekatra
      DATABASE_DISABLE_SSL: "true"   # Local Docker only
      REDIS_URL: redis://redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-cloudapi}
      META_PHONE_NUMBER_ID: ${META_PHONE_NUMBER_ID}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_NUMBER: ${TWILIO_WHATSAPP_NUMBER:-}
      WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Worker is now a first-class service — remove --profile restriction.
    # If you want to run backend-only for frontend dev: use docker-compose up backend frontend postgres redis

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: ekatra-network
